<style>
/* =========================================================
   ОСНОВА
========================================================= */

*,
*::before,
*::after{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000;
}

body{
  overflow-x:hidden;
  font-family:Arial, Helvetica, sans-serif;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  padding:0;
  background:transparent;
  -webkit-appearance:none;
  appearance:none;
}

#app{
  width:100%;
  min-height:100vh;
  min-height:100dvh;

  display:flex;
  justify-content:center;
  align-items:flex-start;

  background:#000;
}

/*
  Весь сайт работает внутри одного фиксированного
  пропорционального макета.

  Поэтому если экран становится меньше/больше,
  весь макет уменьшается или увеличивается целиком,
  а не растягивается по отдельным координатам.
*/
.stage{
  position:relative;

  width:min(100vw, 1000px);

  aspect-ratio:1000 / 1414;

  overflow:hidden;

  background:#000;

  flex:none;
}

.page{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:fill;

  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
}


/* =========================================================
   ВСЕ НАЖИМАЕМЫЕ ЗОНЫ
========================================================= */

.hot{
  position:absolute;
  z-index:50;

  display:block;

  border:0;
  outline:0;

  cursor:pointer;

  touch-action:manipulation;

  user-select:none;
  -webkit-user-select:none;

  background:transparent;
}

.hot:focus{
  outline:none;
}

.hot:active{
  opacity:.85;
}


/* =========================================================
   ВХОД
========================================================= */

  z-index:100;

  top:28%;

  outline:0;

  background:transparent;

  color:transparent;

  caret-color:#fff;

  text-align:center;

  font-size:clamp(22px, 4vw, 42px);

  letter-spacing:.12em;

  pointer-events:auto;

  touch-action:manipulation;

  -webkit-user-select:text;
  user-select:text;
}

#loginInput::selection{
  background:rgba(255,255,255,.25);
}

.login-heart{
  position:absolute;

  z-index:90;

  left:25%;
  top:39%;

  width:50%;
  height:34%;

  border:0;

  background:transparent;

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;
}

.login-error{
  position:absolute;

  z-index:110;

  left:10%;
  top:73%;

  width:80%;

  text-align:center;

  color:#fff;

  font-size:clamp(13px, 2.2vw, 22px);

  opacity:0;

  pointer-events:none;

  transition:opacity .2s ease;
}

.login-error.show{
  opacity:1;
}


/* =========================================================
   НИЖНЯЯ НАВИГАЦИЯ
========================================================= */

.nav{
  position:absolute;

  z-index:80;

  left:0;
  right:0;
  bottom:0;

  height:14%;

  display:flex;
}

.nav button{
  flex:1;

  min-width:0;
  height:100%;

  background:transparent;

  border:0;

  cursor:pointer;

  touch-action:manipulation;

/* =========================================================
   ГЛАВНАЯ
========================================================= */

  top:82%;

  width:28%;
  height:8%;

  cursor:pointer;

  touch-action:manipulation;
}


/* =========================================================
   О ТЕБЕ
========================================================= */

  position:absolute;

  z-index:70;

  cursor:pointer;

  Зоны расположены относительно исходного макета.

  top:25%;
  width:84%;
  height:11%;

#env2{

  top:37%;
  width:84%;
  height:11%;

  top:49%;

  height:11%;

  top:4%;

  height:10%;

  top:20%;

  height:60%;

  top:65%;

.test-options{
  width:100%;

  display:flex;
  flex-direction:column;

  gap:2.2%;

  pointer-events:auto;
}

.test-option{
  position:relative;

  width:100%;
  min-height:52px;

  padding:12px 16px;

  border:1px solid rgba(255,255,255,.45);

  border-radius:16px;

  color:#fff;

  background:rgba(0,0,0,.28);

  text-align:left;

  font-size:clamp(13px, 2.1vw, 21px);

  line-height:1.25;

  cursor:pointer;

  touch-action:manipulation;

  transition:

.test-option:active{
  transform:scale(.985);
}

.test-option.selected{
  background:rgba(255,255,255,.22);

.test-navigation{
  position:absolute;

.result-score{

  border-radius:30px;

  color:#fff;

  cursor:pointer;

/* =========================================================
   МОБИЛЬНЫЕ
========================================================= */

@media (max-width:600px){

  .stage{
    width:100vw;
    max-width:100vw;

  .test-card{

  .test-option{
    min-height:46px;

    padding:9px 11px;

    border-radius:12px;

/* =========================================================
   ПЛАНШЕТ
========================================================= */

@media (min-width:601px) and (max-width:1100px){

  .stage{
    width:100vw;
    max-width:1000px;
  }
}


/* =========================================================
   БОЛЬШОЙ ЭКРАН
========================================================= */

@media (min-width:1101px){

  .stage{
    width:1000px;
  }
}
</style>
</head>

],

[
'Если я не могу уснуть, что вероятнее всего происходит у меня в голове?',
'Ни о чем не думаю',
'Я начинаю думать обо всём подряд',
'Я думаю только о том, что произошло за день',
'Б'
],

[
'Если я сказала «мне всё равно, выбирай сам», что я могу сделать через пять минут?',
'Действительно соглашусь с твоим выбором',
'Вдруг предложу свой вариант',
'Спрошу, почему ты выбрал именно это',
'Б'
],

[
'Если мне хочется плакать, но я стараюсь держаться, я скорее…',
'Стану молчаливой',
'Начну очень много шутить',
'Постараюсь сделать вид, что всё нормально',
'В'
]

];


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

const state = {
  page:'login',

  envelope:0,
  envelopeStage:0,

  q:0,
  selected:null,

  answers:Array(Q.length).fill(null),

  score:0
};


/* =========================================================
   ПУТИ К КАРТИНКАМ
========================================================= */

function img(number){

  const n = String(number).padStart(2,'0');

  return `
    <img
      class="page"
      src="page-${n}.webp"
      alt=""
      draggable="false"
    >
  `;
}


/* =========================================================
   СОЗДАНИЕ ЭКРАНА
========================================================= */

function stage(content){

  return `
    <div class="stage">
      ${content}
    </div>
  `;
}


/* =========================================================
   БЕЗОПАСНЫЙ ТЕКСТ
========================================================= */

function esc(text){

  return String(text)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =========================================================
   НАВИГАЦИЯ
========================================================= */

function goHome(){

  state.page='home';

  render();

}


function goAbout(){

  state.page='about';

  state.envelope=0;
  state.envelopeStage=0;

  render();

}


function goUs(){

  state.page='us';

  render();

}


function goTest(){

  state.page='testIntro';

  render();

}


function goWhen(){

  state.page='when';

  render();

}


/* =========================================================
   ВХОД
========================================================= */

function login(){

  const input = document.getElementById('loginInput');

  if(!input){
    return;
  }

  const value = String(input.value || '').trim();

  if(value === '130425'){

    state.page='home';

    render();

    return;
  }

  input.value='';

  const error = document.getElementById('err');

  if(error){

    error.classList.add('show');

    window.setTimeout(function(){

      error.classList.remove('show');

    },1800);

  }

}


/* =========================================================
   ПОЛЕ ВХОДА
========================================================= */

function setupLogin(){

  const input = document.getElementById('loginInput');

  if(!input){
    return;
  }

  input.addEventListener('keydown',function(event){

    if(event.key === 'Enter'){

      event.preventDefault();

      login();

    }

  });

}


/* =========================================================
   ГЛАВНАЯ
========================================================= */

function homeShort(){

  state.page='homeShort';

  render();

}


/* =========================================================
   КОНВЕРТЫ
========================================================= */

function chooseEnvelope(number){

  state.envelope=number;

  state.envelopeStage=1;

  render();

}


function openEnvelope(){

  if(!state.envelope){
    return;
  }

  state.envelopeStage=2;

  render();

}


function backEnvelope(){

  if(state.envelopeStage === 2){

    state.envelopeStage=1;

  }else{

    state.envelope=0;
    state.envelopeStage=0;
    state.page='about';

  }

  render();

}


/* =========================================================
   ТЕСТ
========================================================= */

function startTest(){

  state.q=0;

  state.selected=null;

  state.score=0;

  state.answers=Array(Q.length).fill(null);

  state.page='test';

  render();

}


function selectAnswer(letter){

  state.selected=letter;

  state.answers[state.q]=letter;

  render();

}


function previousQuestion(){

  if(state.q <= 0){
    return;
  }

  state.q--;

  state.selected=state.answers[state.q] || null;

  render();

}


function nextQuestion(){

  if(state.selected === null){
    return;
  }

  state.answers[state.q]=state.selected;

  if(state.q < Q.length - 1){

    state.q++;

    state.selected=state.answers[state.q] || null;

    render();

    return;
  }

  calculateResult();

}


function calculateResult(){

  let score=0;

  for(let i=0;i<Q.length;i++){

    if(state.answers[i] === Q[i][4]){

      score++;

    }

  }

  state.score=score;

  state.page='testResult';

  render();

}


function restartTest(){

  startTest();

}


/* =========================================================
   НАВИГАЦИЯ В ТЕСТЕ
========================================================= */

function testNavigation(){

  const previousDisabled =
    state.q === 0 ? 'disabled' : '';

  const isLast =
    state.q === Q.length - 1;

  const nextText =
    isLast ? 'Завершить' : 'Далее';

  return `
    <div class="test-navigation">

      <button
        onclick="previousQuestion()"
        ${previousDisabled}
      >
        Назад
      </button>

      <button
        onclick="nextQuestion()"
      >
        ${nextText}
      </button>

    </div>
  `;

}


/* =========================================================
   ЭКРАН ТЕСТА
========================================================= */

function renderTest(){

  const question=Q[state.q];

  let html='';

  html += img(17);

  html += `
    <div class="test-counter">
      ${state.q + 1} / ${Q.length}
    </div>
  `;

  html += `
    <div class="test-card">

      <div class="test-question">
        ${esc(question[0])}
      </div>

      <div class="test-options">

        <button
          class="test-option ${state.selected === 'А' ? 'selected' : ''}"
          onclick="selectAnswer('А')"
        >
          А) ${esc(question[1])}
        </button>

        <button
          class="test-option ${state.selected === 'Б' ? 'selected' : ''}"
          onclick="selectAnswer('Б')"
        >
          Б) ${esc(question[2])}
        </button>

        <button
          class="test-option ${state.selected === 'В' ? 'selected' : ''}"
          onclick="selectAnswer('В')"
        >
          В) ${esc(question[3])}
        </button>

      </div>

    </div>
  `;

  html += testNavigation();

  return stage(html);

}


/* =========================================================
   РЕЗУЛЬТАТ
========================================================= */

function renderResult(){

  let html='';

  html += img(17);

  html += `
    <div class="result-overlay">

      <div class="result-box">

        <div class="result-title">
          Тест закончен
        </div>

        <div class="result-score">
          ${state.score} из ${Q.length}
        </div>

        <button
          class="result-button"
          onclick="restartTest()"
        >
          Пройти ещё раз
        </button>

        <button
          class="result-button"
          onclick="goHome()"
        >
          На главную
        </button>

      </div>

    </div>
  `;

  return stage(html);

}


/* =========================================================
   РАЗДЕЛ «О ТЕБЕ»
========================================================= */

function renderAbout(){

  let html='';

  html += img(4);

  html += `
    <button
      id="env1"
      class="envelope-zone"
      onclick="chooseEnvelope(1)"
      aria-label="Конверт 1"
    ></button>

    <button
      id="env2"
      class="envelope-zone"
      onclick="chooseEnvelope(2)"
      aria-label="Конверт 2"
    ></button>

    <button
      id="env3"
      class="envelope-zone"
      onclick="chooseEnvelope(3)"
      aria-label="Конверт 3"
    ></button>

    <button
      id="env4"
      class="envelope-zone"
      onclick="chooseEnvelope(4)"
      aria-label="Конверт 4"
    ></button>

    <button
      id="env5"
      class="envelope-zone"
      onclick="chooseEnvelope(5)"
      aria-label="Конверт 5"
    ></button>
  `;

  return html;

}


/* =========================================================
   КОНКРЕТНЫЙ КОНВЕРТ
========================================================= */

function renderEnvelope(){

  const closedPages={
    1:5,
    2:7,
    3:9,
    4:11,
    5:13
  };

  const openedPages={
    1:6,
    2:8,
    3:10,
    4:12,
    5:14
  };

  let html='';

  if(state.envelopeStage === 1){

    html += img(closedPages[state.envelope]);

    html += `
      <button
        class="back-zone"
        onclick="backEnvelope()"
        aria-label="Назад"
      ></button>

      <button
        class="envelope-open-zone"
        onclick="openEnvelope()"
        aria-label="Открыть"
      ></button>
    `;

  }else{

    html += img(openedPages[state.envelope]);

    html += `
      <button
        class="back-zone"
        onclick="backEnvelope()"
        aria-label="Назад"
      ></button>
    `;

  }

  return stage(html);

}


/* =========================================================
   НИЖНЯЯ НАВИГАЦИЯ
========================================================= */

function navigation(){

  return `
    <div class="nav">

      <button
        onclick="goHome()"
        aria-label="Главная"
      ></button>

      <button
        onclick="goAbout()"
        aria-label="О тебе"
      ></button>

      <button
        onclick="goUs()"
        aria-label="Мы"
      ></button>

      <button
        onclick="goTest()"
        aria-label="Тест"
      ></button>

      <button
        onclick="goWhen()"
        aria-label="Когда"
      ></button>

    </div>
  `;

}


/* =========================================================
   ОСНОВНОЙ RENDER
========================================================= */

function render(){

  const app=document.getElementById('app');

  let html='';


  /* -------------------------------------------------------
     LOGIN
  ------------------------------------------------------- */

  if(state.page === 'login'){

    html=stage(`

      ${img(1)}

      <input
        id="loginInput"

        type="text"

        inputmode="numeric"

        pattern="[0-9]*"

        maxlength="6"

        autocomplete="off"

        autocorrect="off"

        autocapitalize="off"

        spellcheck="false"

        aria-label="Код"
      >

      <button
        class="login-heart"
        onclick="login()"
        aria-label="Войти"
      ></button>

      <div
        id="err"
        class="login-error"
      >
        Неправильная дата
      </div>

    `);

    app.innerHTML=html;

    setupLogin();

    return;
  }


  /* -------------------------------------------------------
     HOME
  ------------------------------------------------------- */

  if(state.page === 'home'){

    html=stage(`

      ${img(2)}

      <button
        class="home-short-button"
        onclick="homeShort()"
        aria-label="Сократить"
      ></button>

      ${navigation()}

    `);

    app.innerHTML=html;

    return;
  }


  /* -------------------------------------------------------
     HOME SHORT
  ------------------------------------------------------- */

  if(state.page === 'homeShort'){

    html=stage(`

      ${img(3)}

      <button
        class="home-short-button"
        onclick="goHome()"
        aria-label="Обратно"
      ></button>

      ${navigation()}

    `);

    app.innerHTML=html;

    return;
  }


  /* -------------------------------------------------------
     ABOUT
  ------------------------------------------------------- */

  if(state.page === 'about'){

    if(state.envelopeStage !== 0){

      app.innerHTML=renderEnvelope();

      return;
    }

    html=stage(`
      ${renderAbout()}
      ${navigation()}
    `);

    app.innerHTML=html;

    return;
  }


  /* -------------------------------------------------------
     US
  ------------------------------------------------------- */

  if(state.page === 'us'){

    html=stage(`

      ${img(15)}

      ${navigation()}

    `);

    app.innerHTML=html;

    return;
  }


  /* -------------------------------------------------------
     TEST INTRO
  ------------------------------------------------------- */

  if(state.page === 'testIntro'){

    html=stage(`

      ${img(16)}

      <button
        class="test-start-zone"
        onclick="startTest()"
        aria-label="Начать тест"
      ></button>

      ${navigation()}

    `);

    app.innerHTML=html;

    return;
  }


  /* -------------------------------------------------------
     TEST
  ------------------------------------------------------- */

  if(state.page === 'test'){

    app.innerHTML=renderTest();

    return;
  }


  /* -------------------------------------------------------
     TEST RESULT
  ------------------------------------------------------- */

  if(state.page === 'testResult'){

    app.innerHTML=renderResult();

    return;
  }


  /* -------------------------------------------------------
     WHEN
  ------------------------------------------------------- */

  if(state.page === 'when'){

    html=stage(`

      ${img(18)}

      ${navigation()}

    `);

    app.innerHTML=html;

    return;
  }

}


/* =========================================================
   ЗАПУСК
========================================================= */

render();

</script>

</body>
</html>
