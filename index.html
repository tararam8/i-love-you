========================================================= */

  Пароль действует 24 часа.

const STATE_KEY = "loveSiteState_v2";


/* =========================================================
   СОСТОЯНИЕ ПО УМОЛЧАНИЮ
========================================================= */

const defaultState = {

  page:"home",

  envelope:0,

  homeShort:false,

  q:0,

  selected:null,

  score:0,

  answers:[]
};

   СОСТОЯНИЕ
========================================================= */

let state = {
  ...defaultState
};


/* =========================================================
   СОХРАНЕНИЕ СОСТОЯНИЯ
========================================================= */

function saveState(){

  try{

    localStorage.setItem(
      STATE_KEY,
      JSON.stringify(state)
    );

  }catch(error){

    console.warn(
      "Не удалось сохранить состояние:",
      error
    );

  }
}


/* =========================================================
   ЗАГРУЗКА СОСТОЯНИЯ
========================================================= */

function loadState(){

  try{

    const saved =
      localStorage.getItem(STATE_KEY);

    if(!saved){

      state = {
        ...defaultState
      };

      return;
    }

    const parsed =
      JSON.parse(saved);

    state = {
      ...defaultState,
      ...parsed
    };

    if(!Array.isArray(state.answers)){

      state.answers =
        new Array(Q.length).fill(null);

    }

  }catch(error){

    console.warn(
      "Не удалось загрузить состояние:",
      error
    );

    state = {
      ...defaultState
    };

  }
}


/* =========================================================
   ПРОВЕРКА ПАРОЛЯ
========================================================= */

function isLoginValid(){

  try{

    const saved =
      localStorage.getItem(LOGIN_KEY);

    if(!saved){

      return false;
    }

    const loginData =
      JSON.parse(saved);

    if(
      !loginData ||
      !loginData.expires
    ){

      localStorage.removeItem(LOGIN_KEY);

      return false;
    }

    if(Date.now() >= loginData.expires){

      /*
        Удаляем только вход.

        Прогресс теста остаётся.
      */

      localStorage.removeItem(LOGIN_KEY);

      return false;
    }

    return true;

  }catch(error){

    localStorage.removeItem(LOGIN_KEY);

    return false;
  }
}


/* =========================================================
   СОХРАНИТЬ ВХОД
========================================================= */

function saveLogin(){

  try{

    localStorage.setItem(
      LOGIN_KEY,
      JSON.stringify({
        expires:
          Date.now() + LOGIN_DURATION
      })
    );

  }catch(error){

    console.warn(
      "Не удалось сохранить вход:",

    );

  }
}

["Действительно соглашусь с твоим выбором","Вдруг предложу свой вариант","Спрошу, почему ты выбрал именно это"],1
],

[

["Стану молчаливой","Начну очень много шутить","Постараюсь сделать вид, что всё нормально"],2
]

/* =========================================================
   КАРТИНКИ
========================================================= */

function img(n){

  return `
    <img
      class="page"
      src="page-${String(n).padStart(2,"0")}.webp"
      alt=""
      draggable="false"
    >
  `;
}


/* =========================================================
   STAGE
========================================================= */

function screen(content){

  return `
    <div class="stage" id="stage">
      ${content}
    </div>
  `;
}


/* =========================================================
   ПОДГОНКА ХОЛСТА ПОД НАСТОЯЩУЮ
   ПРОПОРЦИЮ КАРТИНКИ
========================================================= */

function fitStage(){

  const stage =
    document.getElementById("stage");

  if(!stage) return;

  const page =
    stage.querySelector(".page");

  if(!page) return;


  function resize(){

    if(
      !page.naturalWidth ||
      !page.naturalHeight
    ){

      return;
    }


    const imageRatio =
      page.naturalWidth /
      page.naturalHeight;


    const viewportWidth =
      window.innerWidth;


    const viewportHeight =
      window.innerHeight;


    /*
      Сначала пытаемся сделать картинку
      максимально широкой.
    */

    let width =
      viewportWidth;

    let height =
      width / imageRatio;


    /*
      Если по высоте не помещается —
      уменьшаем и ширину, и высоту.

      Поэтому картинка НИКОГДА
      не растягивается.
    */

    if(height > viewportHeight){

      height =
        viewportHeight;

      width =
        height * imageRatio;
    }


    stage.style.width =
      Math.floor(width) + "px";

    stage.style.height =
      Math.floor(height) + "px";

  }


  if(page.complete){

    resize();

  }else{

    page.addEventListener(
      "load",
      resize,
      {once:true}
    );

  }

}


/* =========================================================
   НАВИГАЦИЯ
========================================================= */

function nav(){

  return `
    <div class="nav">

      <button
        onclick="goHome()"
        aria-label="Главная">
      </button>

      <button
        onclick="goAbout()"
        aria-label="О тебе">
      </button>

      <button
        onclick="goUs()"
        aria-label="Мы">
      </button>

      <button
        onclick="goTestIntro()"
        aria-label="Тест">
      </button>

      <button
        onclick="goWhen()"
        aria-label="Когда">
      </button>

    </div>
  `;
}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  const input =
    document.getElementById("loginInput");

  const err =
    document.getElementById("err");

  if(!input) return;


  const value =
    input.value.trim();


  if(value === CODE){

    saveLogin();


    /*
      Пароль введён правильно.

      Прогресс теста НЕ трогаем.
    */

    state.page = "home";

    saveState();

    render();

  }else{

    input.value = "";

    if(err){

      err.classList.add("show");

      setTimeout(function(){

        err.classList.remove("show");

      },1800);

    }

  }

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

  state.page =
    state.homeShort
      ? "homeShort"
      : "home";

  state.envelope = 0;

  saveState();

  render();
}


/* =========================================================
   ABOUT
========================================================= */

function goAbout(){

  state.page = "about";

  state.envelope = 0;

  saveState();

  render();
}


/* =========================================================
   US
========================================================= */

function goUs(){

  state.page = "us";

  state.envelope = 0;

  saveState();

  render();
}


/* =========================================================
   WHEN
========================================================= */

function goWhen(){

  state.page = "when";

  state.envelope = 0;

  saveState();

  render();
}


/* =========================================================
   HOME SHORT
========================================================= */

function toggleHome(){

  state.homeShort =
    !state.homeShort;

  state.page =
    state.homeShort
      ? "homeShort"
      : "home";

  saveState();

  render();
}


/* =========================================================
   ENVELOPES
========================================================= */

function chooseEnvelope(number){

  /*
    Первый клик:
    увеличенный конверт.

    Второй клик:
    открытое письмо.
  */

  if(state.envelope === number){

    state.page =
      "letter" + number;

    saveState();

    render();

    return;
  }


  state.envelope = number;

  state.page =
    "envelopeZoom";

  saveState();

  render();
}


function backToEnvelopes(){

  state.envelope = 0;

  state.page = "about";

  saveState();

  render();
}


/* =========================================================
   TEST INTRO
========================================================= */

function goTestIntro(){

  state.page = "testIntro";

  saveState();

  render();
}


/* =========================================================
   ПРОВЕРКА ПРОГРЕССА
========================================================= */

function hasTestProgress(){

  if(!Array.isArray(state.answers)){

    return false;
  }


  return (
    state.page === "test" ||
    state.page === "result" ||
    state.q > 0 ||
    state.selected !== null ||
    state.answers.some(
      answer =>
        answer !== null &&
        answer !== undefined
    )
  );
}


/* =========================================================
   START / RESUME TEST
========================================================= */

function startTest(){

  /*
    Если тест уже начинался —
    продолжаем его.
  */

  if(hasTestProgress()){

    if(
      Array.isArray(state.answers) &&
      state.answers[state.q] !== null &&
      state.answers[state.q] !== undefined
    ){

      state.selected =
        state.answers[state.q];

    }

    state.page = "test";

    saveState();

    render();

    return;
  }


  /*
    Новый тест.
  */

  state.q = 0;

  state.selected = null;

  state.score = 0;

  state.answers =
    new Array(Q.length).fill(null);

  state.page = "test";

  saveState();

  render();
}


/* =========================================================
   ВЫБОР ОТВЕТА
========================================================= */

function selectAnswer(index){

  if(state.page !== "test"){

    return;
  }


  state.selected = index;


  if(!Array.isArray(state.answers)){

    state.answers =
      new Array(Q.length).fill(null);
  }


  state.answers[state.q] =
    index;


  /*
    Сохраняем моментально.
  */

  saveState();


  render();
}


/* =========================================================
   СЛЕДУЮЩИЙ ВОПРОС
========================================================= */

function nextQuestion(){

  if(state.selected === null){

    return;
  }


  state.answers[state.q] =
    state.selected;


  /*
    Последний вопрос.
  */

  if(state.q === Q.length - 1){

    state.score = 0;


    for(
      let i = 0;
      i < Q.length;
      i++
    ){

      if(
        state.answers[i] === Q[i][2]
      ){

        state.score++;
      }

    }


    state.page = "result";

    saveState();

    render();

    return;
  }


  state.q++;


  /*
    Восстанавливаем ответ,
    если он уже был выбран ранее.
  */

  if(
    state.answers[state.q] === null ||
    state.answers[state.q] === undefined
  ){

    state.selected = null;

  }else{

    state.selected =
      state.answers[state.q];

  }


  saveState();

  render();
}


/* =========================================================
   ПРЕДЫДУЩИЙ ВОПРОС
========================================================= */

function prevQuestion(){

  if(state.q <= 0){

    return;
  }


  state.answers[state.q] =
    state.selected;


  state.q--;


  if(
    state.answers[state.q] === null ||
    state.answers[state.q] === undefined
  ){

    state.selected = null;

  }else{

    state.selected =
      state.answers[state.q];

  }


  saveState();

  render();
}


/* =========================================================
   НАЧАТЬ ЗАНОВО
========================================================= */

function restartTest(){

  state.q = 0;

  state.selected = null;

  state.score = 0;

  state.answers =
    new Array(Q.length).fill(null);

  state.page = "testIntro";

  saveState();

  render();
}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const app =
    document.getElementById("app");

  let s = "";


  /* ---------------------------------
     LOGIN
  --------------------------------- */

  if(state.page === "login"){

    s = screen(

      img(1) +

      `
        <input
          id="loginInput"
          class="login-input"
          type="text"
          inputmode="numeric"
          maxlength="6"
          autocomplete="off"
          aria-label="Код"
        >

        <button
          class="login-heart"
          onclick="login()"
          aria-label="Войти">
        </button>

        <div
          id="err"
          class="login-error">
          Неправильная дата
        </div>
      `

    );

  }


  /* ---------------------------------
     HOME
  --------------------------------- */

  else if(state.page === "home"){

    s = screen(

      img(2) +

      nav() +

      `
        <button
          class="home-short-hot"
          onclick="toggleHome()"
          aria-label="Сократить">
        </button>
      `

    );

  }


  /* ---------------------------------
     HOME SHORT
  --------------------------------- */

  else if(state.page === "homeShort"){

    s = screen(

      img(3) +

      nav() +

      `
        <button
          class="home-short-hot"
          onclick="toggleHome()"
          aria-label="Обратно">
        </button>
      `

    );

  }


  /* ---------------------------------
     ABOUT
  --------------------------------- */

  else if(state.page === "about"){

    s = screen(

      img(4) +

      nav() +

      `
        <button
          class="envelope-zone env1"
          onclick="chooseEnvelope(1)"
          aria-label="Конверт 1">
        </button>

        <button
          class="envelope-zone env2"
          onclick="chooseEnvelope(2)"
          aria-label="Конверт 2">
        </button>

        <button
          class="envelope-zone env3"
          onclick="chooseEnvelope(3)"
          aria-label="Конверт 3">
        </button>

        <button
          class="envelope-zone env4"
          onclick="chooseEnvelope(4)"
          aria-label="Конверт 4">
        </button>

        <button
          class="envelope-zone env5"
          onclick="chooseEnvelope(5)"
          aria-label="Конверт 5">
        </button>
      `

    );

  }


  /* ---------------------------------
     ENVELOPE ZOOM
  --------------------------------- */

  else if(state.page === "envelopeZoom"){

    const number =
      state.envelope;

    const closedPage =
      5 + ((number - 1) * 2);

    s = screen(

      img(closedPage) +

      nav() +

      `
        <button
          class="zoom-envelope"
          onclick="chooseEnvelope(${number})"
          aria-label="Открыть конверт">
        </button>

        <button
          class="back-zone"
          onclick="backToEnvelopes()"
          aria-label="Назад">
        </button>
      `

    );

  }


  /* ---------------------------------
     LETTERS
  --------------------------------- */

  else if(
    state.page === "letter1" ||
    state.page === "letter2" ||
    state.page === "letter3" ||
    state.page === "letter4" ||
    state.page === "letter5"
  ){

    const number =
      Number(
        state.page.replace(
          "letter",
          ""
        )
      );

    const letterPage =
      6 + ((number - 1) * 2);

    s = screen(

      img(letterPage) +

      nav() +

      `
        <button
          class="back-zone"
          onclick="backToEnvelopes()"
          aria-label="Назад">
        </button>
      `

    );

  }


  /* ---------------------------------
     US
  --------------------------------- */

  else if(state.page === "us"){

    s = screen(

      img(15) +

      nav()

    );

  }


  /* ---------------------------------
     TEST INTRO
  --------------------------------- */

  else if(state.page === "testIntro"){

    s = screen(

      img(16) +

      nav() +

      `
        <button
          class="test-start"
          onclick="startTest()"
          aria-label="Начать тест">
        </button>
      `

    );

  }


  /* ---------------------------------
     TEST
  --------------------------------- */

  else if(state.page === "test"){

    /*
      Защита от неправильного номера вопроса.
    */

    if(
      state.q < 0 ||
      state.q >= Q.length
    ){

      state.q = 0;

      state.selected = null;

      saveState();
    }


    const question =
      Q[state.q];


    s = screen(

      img(17) +

      nav() +

      /*
        Три большие сенсорные зоны.
        Текст вопроса находится внутри картинки,
        поэтому отдельный текст поверх неё
        НЕ рисуем.
      */

      `
        <button
          class="test-option option1"
          onclick="selectAnswer(0)"
          aria-label="${question[1][0]}">
        </button>

        <button
          class="test-option option2"
          onclick="selectAnswer(1)"
          aria-label="${question[1][1]}">
        </button>

        <button
          class="test-option option3"
          onclick="selectAnswer(2)"
          aria-label="${question[1][2]}">
        </button>

        <button
          class="test-next"
          onclick="nextQuestion()"
          aria-label="Следующий вопрос">
        </button>
      `

    );

  }


  /* ---------------------------------
     RESULT
  --------------------------------- */

  else if(state.page === "result"){

    s = screen(

      img(17) +

      nav() +

      `
        <div class="test-result">

          <div>

            <div>
              Ты ответил правильно
            </div>

            <div
              style="
                font-size:clamp(40px,8vw,100px);
                margin-top:10px;
                color:#e91e91;
              ">
              ${state.score}/50
            </div>

            <div
              style="
                font-size:clamp(18px,3vw,35px);
                margin-top:15px;
              ">
              вопросов
            </div>

            <button
              onclick="restartTest()">
              Пройти ещё раз
            </button>

          </div>

        </div>
      `

    );

  }


  /* ---------------------------------
     WHEN
  --------------------------------- */

  else if(state.page === "when"){

    s = screen(

      img(18) +

      nav()

    );

  }


  /* ---------------------------------
     ВЫВОД
  --------------------------------- */

  app.innerHTML = s;


  /*
    После вставки HTML
    подгоняем stage под настоящий
    размер изображения.
  */

  fitStage();


  /* ---------------------------------
     ENTER НА LOGIN
  --------------------------------- */

  if(state.page === "login"){

    const input =
      document.getElementById(
        "loginInput"
      );

    if(input){

      input.addEventListener(
        "keydown",
        function(e){

          if(e.key === "Enter"){

            e.preventDefault();

            login();

          }

        }
      );

    }

  }

}


/* =========================================================
   ПЕРЕСЧЁТ РАЗМЕРА ПРИ ПОВОРОТЕ
   И ИЗМЕНЕНИИ РАЗМЕРА ЭКРАНА
========================================================= */

window.addEventListener(
  "resize",
  function(){

    fitStage();

  }
);


window.addEventListener(
  "orientationchange",
  function(){

    setTimeout(
      fitStage,
      100
    );

  }
);


/* =========================================================
   СОХРАНЕНИЕ
========================================================= */

window.addEventListener(
  "beforeunload",
  function(){

    saveState();

  }
);


document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.visibilityState === "hidden"
    ){

      saveState();

    }

  }
);


/* =========================================================
   ЗАПУСК
========================================================= */

loadState();


const loggedIn =
  isLoginValid();


/*
  Пароль действителен:
  открываем сохранённое состояние.

  Пароль истёк:
  показываем login.

  При этом STATE_KEY остаётся.
*/

if(loggedIn){

  if(!state.page){

    state.page = "home";

  }

}else{

  state.page = "login";

}


render();

</script>
