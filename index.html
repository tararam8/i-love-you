}


/* ---------- ОТРИСОВКА ---------- */

function render(){

  let s='';


  /* ВХОД */

  if(state.page==='login'){

    s=screen(
      'login',

      img(1)+

      `
      <input
        id="loginInput"
        inputmode="numeric"
        maxlength="6"
        autocomplete="off"
        aria-label="Код"
      >

      <button
        class="login-heart"
        onclick="login()"
        aria-label="Войти">
      </button>

      <div id="err" class="login-error">
        Неправильная дата
      </div>
      `
    );

  }


  /* ГЛАВНАЯ */

  else if(state.page==='home'){

    s=screen(
      'home',

      img(2)+

      nav()+

      `
      <button
        class="hot main-short"
        onclick="go('homeShort')"
        aria-label="Сократить">
      </button>
      `
    );

  }


  /* ГЛАВНАЯ — СОКРАЩЁННАЯ */

  else if(state.page==='homeShort'){

    s=screen(
      'home-short',

      img(3)+

      nav()+

      `
      <button
        class="hot main-back"
        onclick="go('home')"
        aria-label="Обратно">
      </button>
      `
    );

  }


  /* О ТЕБЕ */

  else if(state.page==='about'){

    s=screen(
      'about',

      img(4)+

      nav()+

      `
      <button
        class="about-envelope env1"
        onclick="openEnvelope(1)"
        aria-label="Конверт 1">
      </button>

      <button
        class="about-envelope env2"
        onclick="openEnvelope(2)"
        aria-label="Конверт 2">
      </button>

      <button
        class="about-envelope env3"
        onclick="openEnvelope(3)"
        aria-label="Конверт 3">
      </button>

      <button
        class="about-envelope env4"
        onclick="openEnvelope(4)"
        aria-label="Конверт 4">
      </button>

      <button
        class="about-envelope env5"
        onclick="openEnvelope(5)"
        aria-label="Конверт 5">
      </button>
      `
    );

  }


  /* ЗАКРЫТЫЙ КОНВЕРТ */

  else if(state.page==='envClosed'){

    const page=5+2*(state.envelope-1);

    s=screen(
      'envclosed',

      img(page)+

      `
      <button
        class="envelope-open-screen"
        onclick="openLetter(${state.envelope})"
        aria-label="Открыть конверт">
      </button>

      <button
        class="hot back-about"
        onclick="go('about')"
        aria-label="Назад">
      </button>
      `
    );

  }


  /* ОТКРЫТОЕ ПИСЬМО */

  else if(state.page==='letter'){

    const page=6+2*(state.envelope-1);

    s=screen(
      'letter',

      img(page)+

      `
      <button
        class="hot back-open"
        onclick="go('about')"
        aria-label="Назад">
      </button>
      `
    );

  }


  /* МЫ */

  else if(state.page==='us'){

    s=screen(
      'us',
      img(15)+nav()
    );

  }


  /* КОГДА */

  else if(state.page==='when'){

    s=screen(
      'when',
      img(18)+nav()
    );

  }


  /* НАЧАЛО ТЕСТА */

  else if(state.page==='testIntro'){

    s=screen(
      'test-intro',

      img(16)+

      nav()+

      `
      <button
        class="hot start-test"
        onclick="startTest()"
        aria-label="Начать тест">
      </button>
      `
    );

  }


  /* ТЕСТ */

  else if(state.page==='test'){

    s=renderTest();

  }


  app.innerHTML=s;


  /* ФОКУС НА ПОЛЕ КОДА */

  if(state.page==='login'){

    const input=document.getElementById('loginInput');

    if(input){

      input.addEventListener(
        'keydown',
        function(e){

          if(e.key==='Enter'){
            login();
          }

        }
      );

      input.focus();

    }

  }

}


/* ---------- ВХОД ---------- */

function login(){

  const input=document.getElementById('loginInput');
  const err=document.getElementById('err');

  if(!input)return;

  const value=input.value.trim();

  if(value==='130425'){

    state.page='home';

    render();

  }else{

    input.value='';

    if(err){

      err.classList.add('show');

      setTimeout(
        function(){
          err.classList.remove('show');
        },
        1800
      );

    }

  }

}


/* ---------- ПЕРЕХОД ---------- */

function go(page){

  state.page=page;
  state.selected=null;

  render();

  window.scrollTo(0,0);

}


/* ---------- КОНВЕРТЫ ---------- */

function openEnvelope(n){

  state.envelope=n;
  state.page='envClosed';

  render();

}


/* ---------- ПИСЬМО ---------- */

function openLetter(n){

  state.envelope=n;
  state.page='letter';

  render();

}


/* ---------- НАЧАЛО ТЕСТА ---------- */

function startTest(){

  state.q=0;
  state.selected=null;
  state.score=0;
  state.page='test';

  render();

}


/* ---------- ЭКРАНИРОВАНИЕ ТЕКСТА ---------- */

function escapeHtml(x){

  return String(x).replace(
    /[&<>"']/g,

    function(m){

      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[m];

    }
  );

}


/* ---------- ТЕСТ ---------- */

function renderTest(){

  const current=Q[state.q];

  if(!current){

    showFinal();

    return '';

  }

  const question=current[0];
  const a=current[1];
  const b=current[2];
  const c=current[3];

  const picked=state.selected;


  return screen(

    'test',

    img(17)+

    nav()+

    `
    <div class="test-overlay">

      <div class="test-cover"></div>

      <div class="test-counter">
        ${state.q+1}/50
      </div>

      <div class="test-card">
        ${escapeHtml(question)}
      </div>


      <button
        class="option-button ${picked==='А'?'selected':''}"
        style="top:69.4%"
        onclick="pick('А')">

        <span class="option-square"></span>

        <span class="option-text">
          ${escapeHtml(a)}
        </span>

      </button>


      <button
        class="option-button ${picked==='Б'?'selected':''}"
        style="top:75.3%"
        onclick="pick('Б')">

        <span class="option-square"></span>

        <span class="option-text">
          ${escapeHtml(b)}
        </span>

      </button>


      <button
        class="option-button ${picked==='В'?'selected':''}"
        style="top:81.2%"
        onclick="pick('В')">

        <span class="option-square"></span>

        <span class="option-text">
          ${escapeHtml(c)}
        </span>

      </button>


      ${
        state.q>0
        ?
        `
        <button
          class="test-back-button"
          onclick="prevQuestion()">

          ← назад

        </button>
        `
        :
        ''
      }


      <button
        class="test-next-button ${picked?'ready':''}"
        onclick="nextQuestion()"
        ${picked?'':'disabled'}>

        →

      </button>

    </div>
    `

  );

}


/* ---------- ВЫБОР ОТВЕТА ---------- */

function pick(value){

  state.selected=value;

  render();

}


/* ---------- СЛЕДУЮЩИЙ ВОПРОС ---------- */

function nextQuestion(){

  if(state.selected===null){
    return;
  }

  const current=Q[state.q];

  if(state.selected===current[4]){
    state.score++;
  }


  if(state.q>=Q.length-1){

    showFinal();

    return;

  }


  state.q++;
  state.selected=null;

  render();

  window.scrollTo(0,0);

}


/* ---------- НАЗАД В ТЕСТЕ ---------- */

function prevQuestion(){

  if(state.q<=0){
    return;
  }

  state.q--;
  state.selected=null;

  render();

  window.scrollTo(0,0);

}


/* ---------- ФИНАЛ ---------- */

function showFinal(){

  const percent=Math.round((state.score/Q.length)*100);

  app.innerHTML=screen(
    'result',

    `
    <div class="final">

      <div class="final-box">

        <div class="final-title">
          Тест закончен 💗
        </div>

        <div class="final-score">
          Ты набрал ${state.score} из ${Q.length}.
          <br>
          Это ${percent}%!
        </div>

        <div class="final-text">
          Спасибо, что знаешь меня всё лучше.
          <br><br>
          Я люблю тебя.
        </div>

        <button
          class="final-home"
          onclick="go('home')">

          На главную

        </button>

      </div>

    </div>
    `
  );

}
