<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Любовь</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000}body{display:flex;justify-content:center}#app{width:min(100vw,1000px);position:relative}.screen{position:relative;width:100%;display:none}.screen.active{display:block}.page{display:block;width:100%;height:auto}.hot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer}.nav-home{left:5%;top:0;width:14%;height:6%}.nav-about{left:29%;top:0;width:14%;height:6%}.nav-us{left:47%;top:0;width:12%;height:6%}.nav-test{left:63%;top:0;width:12%;height:6%}.nav-when{left:79%;top:0;width:17%;height:6%}#loginInput{position:absolute;left:36.2%;top:42.1%;width:17.2%;height:9.4%;border:0;background:transparent;outline:0;text-align:center;color:#ff4ca0;font:bold 22px Arial}.login-heart{position:absolute;left:25%;top:28%;width:50%;height:38%;background:transparent;border:0}.login-error{position:absolute;left:34%;top:53%;width:30%;text-align:center;color:#ff1493;font-weight:bold;opacity:0}.login-error.show{opacity:1}.about-envelope{position:absolute;width:23%;height:12%;background:transparent;border:0}.env1{left:3.5%;top:40%}.env2{left:74%;top:40%}.env3{left:37%;top:45%}.env4{left:3.5%;top:53%}.env5{left:74%;top:53%}.envelope-open-screen{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0}.back{left:0;bottom:0;width:20%;height:18%}.start-test{left:35%;top:74%;width:30%;height:16%;background:transparent;border:0}.test-overlay{position:absolute;inset:0}.test-counter{position:absolute;left:51%;top:44.2%;width:43%;height:4.2%;background:#d83c8d;color:#fff;padding:1%;font:bold 22px monospace}.test-card{position:absolute;left:51%;top:48.3%;width:43%;min-height:14.5%;background:#ffe3ed;border:6px solid #d83c8d;padding:1.5%;font:bold 18px monospace;text-align:center}.option{position:absolute;left:50%;width:47%;min-height:5.8%;background:transparent;border:0;display:flex;gap:2%;align-items:center;text-align:left;font:bold 18px monospace}.o1{top:69.4%}.o2{top:75.3%}.o3{top:81.2%}.sq{width:30px;height:30px;border:4px solid #111;background:#ffe8ef;flex:none}.selected .sq{background:#ff168e;border-color:#ff168e}.next{position:absolute;right:3%;bottom:7%;width:16%;height:14%;background:transparent;border:0;color:#d83c8d;font:bold 44px monospace}.final{position:absolute;inset:0;background:rgba(255,215,230,.96);display:flex;align-items:center;justify-content:center;text-align:center;color:#c72d7a;font:bold 28px monospace;padding:8%}.final button{margin-top:25px;padding:12px 24px;background:#d83c8d;color:#fff;border:0;border-radius:8px}@media(max-width:600px){.test-card,.option{font-size:12px}.sq{width:20px;height:20px;border-width:3px}}</style></head><body><div id="app"></div><script>
const Q=Array.from({length:50},(_,i)=>['Вопрос '+(i+1), 'А) Вариант А','Б) Вариант Б','В) Вариант В','А']);
const app=document.getElementById('app');let s={page:'login',env:0,q:0,sel:null,ans:Array(50).fill(null),score:0};
function img(n){return `<img class="page" src="page-${String(n).padStart(2,'0')}.webp">`}function screen(c,x){return `<section class="screen active ${c}">${x}</section>`}function nav(){return `<button class="hot nav-home" onclick="go('home')"></button><button class="hot nav-about" onclick="go('about')"></button><button class="hot nav-us" onclick="go('us')"></button><button class="hot nav-test" onclick="go('intro')"></button><button class="hot nav-when" onclick="go('when')"></button>`}
function render(){let x='';if(s.page==='login')x=screen('login',img(1)+`<input id="loginInput" maxlength="6" inputmode="numeric"><button class="login-heart" onclick="login()"></button><div id="err" class="login-error">Неправильная дата</div>`);else if(s.page==='home')x=screen('home',img(2)+nav()+`<button class="hot" style="left:50%;top:15.8%;width:14%;height:4.8%" onclick="go('short')"></button>`);else if(s.page==='short')x=screen('short',img(3)+nav()+`<button class="hot" style="left:50%;top:15.8%;width:14%;height:4.8%" onclick="go('home')"></button>`);else if(s.page==='about')x=screen('about',img(4)+nav()+[1,2,3,4,5].map(n=>`<button class="about-envelope env${n}" onclick="env(${n})"></button>`).join(''));else if(s.page==='closed')x=screen('closed',img(5+2*(s.env-1))+`<button class="envelope-open-screen" onclick="letter(${s.env})"></button><button class="hot back" onclick="go('about')"></button>`);else if(s.page==='letter')x=screen('letter',img(6+2*(s.env-1))+`<button class="hot back" onclick="go('about')"></button>`);else if(s.page==='us')x=screen('us',img(15)+nav());else if(s.page==='when')x=screen('when',img(18)+nav());else if(s.page==='intro')x=screen('intro',img(16)+nav()+`<button class="start-test" onclick="start()"></button>`);else if(s.page==='test')x=test();app.innerHTML=x;if(s.page==='login'){let i=document.getElementById('loginInput');i.onkeydown=e=>e.key==='Enter'&&login();i.focus()}}
function login(){let i=document.getElementById('loginInput');if(i.value.trim()==='130425'){go('home')}else{let e=document.getElementById('err');i.value='';e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}}function go(p){s.page=p;s.sel=null;render();scrollTo(0,0)}function env(n){s.env=n;go('closed')}function letter(n){s.env=n;go('letter')}function start(){s.q=0;s.sel=null;s.ans=Array(50).fill(null);s.score=0;go('test')}function test(){let q=Q[s.q],p=s.sel;return screen('test',img(17)+nav()+`<div class="test-overlay"><div class="test-counter">${s.q+1}/50</div><div class="test-card">${q[0]}</div><button class="option o1 ${p==='А'?'selected':''}" onclick="pick('А')"><span class="sq"></span>${q[1]}</button><button class="option o2 ${p==='Б'?'selected':''}" onclick="pick('Б')"><span class="sq"></span>${q[2]}</button><button class="option o3 ${p==='В'?'selected':''}" onclick="pick('В')"><span class="sq"></span>${q[3]}</button>${s.q?'<button class="hot" style="left:1%;top:1%;width:20%;height:10%;color:#d83c8d" onclick="prev()">← назад</button>':''}<button class="next" onclick="next()" ${p?'':'disabled'}>→</button></div>`)}function pick(v){s.sel=v;render()}function next(){if(!s.sel)return;s.ans[s.q]=s.sel;if(s.q===49){s.score=s.ans.reduce((n,a,i)=>n+(a===Q[i][4]),0);return final()}s.q++;s.sel=s.ans[s.q];render()}function prev(){if(s.q){s.q--;s.sel=s.ans[s.q];render()}}function final(){app.innerHTML=screen('result',`<div class="final"><div>Тест закончен 💗<br><br>Ты набрал ${s.score} из 50.<br><br>Спасибо, что знаешь меня всё лучше.<br><br>Я люблю тебя.<br><button onclick="go('home')">На главную</button></div></div>`)}render();</script></body></html>
