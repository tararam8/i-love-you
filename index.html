<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Любовь</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
}

#app{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#000;
}

.stage{
  position:relative;
  overflow:hidden;
  flex:none;
}

.page{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  object-fit:fill;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}

button{
  font-family:inherit;
}

/* =========================
   НАВИГАЦИЯ
========================= */

.nav{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:14%;
  z-index:100;
  pointer-events:none;
}

.nav button{
  position:absolute;
  top:0;
  height:100%;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  pointer-events:auto;
  cursor:pointer;
  touch-action:manipulation;
}

.nav-home{
  left:0%;
  width:20%;
}

.nav-about{
  left:20%;
  width:20%;
}

.nav-us{
  left:40%;
  width:20%;
}

.nav-test{
  left:60%;
  width:20%;
}

.nav-when{
  left:80%;
  width:20%;
}

/* =========================
   LOGIN
========================= */

.login-box{
  position:absolute;
  z-index:300;
  left:50%;
  top:53%;
  transform:translate(-50%,-50%);
  width:34%;
  height:10%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-input{
  width:100%;
  height:100%;
  border:0;
  outline:none;
  background:transparent;
  text-align:center;
  font-size:clamp(18px,3vw,34px);
  color:#000;
  font-weight:500;
}

.login-input::placeholder{
  color:rgba(0,0,0,.5);
}

.login-error{
  position:absolute;
  left:50%;
  top:65%;
  transform:translateX(-50%);
  z-index:301;
  color:#b00020;
  font-size:clamp(12px,2vw,20px);
  text-align:center;
  display:none;
}

/* =========================
   HOME SHORTEN
========================= */

.home-toggle{
  position:absolute;
  z-index:120;
  right:5%;
  bottom:5%;
  width:18%;
  height:12%;
  border:0;
  background:transparent;
  cursor:pointer;
  pointer-events:auto;
  touch-action:manipulation;
}

/* =========================
   ENVELOPES
========================= */

.envelope-zone{
  position:absolute;
  z-index:120;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  cursor:pointer;
  pointer-events:auto;
  touch-action:manipulation;
}

.env1{
  left:8%;
  top:42%;
  width:15%;
  height:22%;
}

.env2{
  left:27%;
  top:42%;
  width:15%;
  height:22%;
}

.env3{
  left:46%;
  top:42%;
  width:15%;
  height:22%;
}

.env4{
  left:65%;
  top:42%;
  width:15%;
  height:22%;
}

.env5{
  left:84%;
  top:42%;
  width:12%;
  height:22%;
}

/* back from opened envelope */
.envelope-back{
  position:absolute;
  z-index:150;
  left:3%;
  bottom:4%;
  width:18%;
  height:14%;
  border:0;
  background:transparent;
  cursor:pointer;
  pointer-events:auto;
  touch-action:manipulation;
}

/* =========================
   TEST START
========================= */

.test-start{
  position:absolute;
  z-index:200;
  left:25%;
  top:62%;
  width:50%;
  height:18%;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  cursor:pointer;
  pointer-events:auto;
  touch-action:manipulation;
}

/* =========================
   TEST ANSWERS
========================= */

.test-option{
  position:absolute;
  z-index:500;
  left:3%;
  width:77%;

  border:0;
  outline:none;
  background:rgba(255,255,255,0.001);

  padding:0;
  margin:0;

  cursor:pointer;
  pointer-events:auto;

  -webkit-appearance:none;
  appearance:none;

  touch-action:manipulation;
  user-select:none;
}

.test-option:focus{
  outline:none;
}

.test-option:active{
  background:rgba(255,255,255,0.08);
}

/*
  Три большие зоны.
  Они специально перекрывают всю область
  каждого ответа, чтобы на телефоне
  невозможно было промахнуться.
*/

.option1{
  top:60%;
  height:11%;
}

.option2{
  top:71%;
  height:11%;
}

.option3{
  top:82%;
  height:11%;
}

/* =========================
   NEXT
========================= */

.test-next{
  position:absolute;
  z-index:550;

  right:2%;
  bottom:3%;

  width:18%;
  height:16%;

  border:0;
  outline:none;
  background:rgba(255,255,255,0.001);

  padding:0;
  margin:0;

  cursor:pointer;
  pointer-events:auto;
  touch-action:manipulation;
}

.test-next:active{
  background:rgba(255,255,255,0.08);
}

/* =========================
   RESULT
========================= */

.result-overlay{
  position:absolute;
  inset:0;
  z-index:800;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.55);
}

.result-box{
  width:60%;
  max-width:700px;
  padding:5%;
  text-align:center;

  background:#fff;
  border-radius:20px;

  color:#000;
}

.result-score{
  font-size:clamp(30px,6vw,70px);
  font-weight:bold;
  margin-bottom:3%;
}

.result-text{
  font-size:clamp(16px,2.5vw,30px);
  margin-bottom:5%;
}

.result-button{
  width:50%;
  min-height:50px;
  border:1px solid #000;
  background:#fff;
  color:#000;
  border-radius:10px;
  cursor:pointer;
  font-size:clamp(14px,2vw,22px);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .login-box{
    width:42%;
    height:11%;
  }

  .nav{
    height:15%;
  }

  .test-option{
    left:2%;
    width:78%;
  }

  .option1{
    top:59%;
    height:12%;
  }

  .option2{
    top:71%;
    height:12%;
  }

  .option3{
    top:83%;
    height:12%;
  }

  .test-next{
    width:19%;
    height:17%;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="stage" id="stage">

    <!-- Текущая страница -->
    <img
      id="pageImage"
      class="page"
      src="page-01.webp"
      draggable="false"
      alt=""
    >

    <!-- =========================
         LOGIN
    ========================== -->

    <div id="loginLayer">

      <div class="login-box">
        <input
          id="passwordInput"
          class="login-input"
          type="password"
          inputmode="numeric"
          autocomplete="off"
          placeholder=""
          maxlength="20"
        >
      </div>

      <div id="loginError" class="login-error">
        Неверный код
      </div>

    </div>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <div id="navigation" class="nav" style="display:none;">

      <button
        class="nav-home"
        type="button"
        onclick="goHome()"
        aria-label="Главная">
      </button>

      <button
        class="nav-about"
        type="button"
        onclick="goAbout()"
        aria-label="О тебе">
      </button>

      <button
        class="nav-us"
        type="button"
        onclick="goUs()"
        aria-label="Мы">
      </button>

      <button
        class="nav-test"
        type="button"
        onclick="goTest()"
        aria-label="Тест">
      </button>

      <button
        class="nav-when"
        type="button"
        onclick="goWhen()"
        aria-label="Когда">
      </button>

    </div>


    <!-- =========================
         HOME BUTTON
    ========================== -->

    <button
      id="homeToggle"
      class="home-toggle"
      type="button"
      onclick="toggleHome()"
      style="display:none;"
      aria-label="Сократить">
    </button>


    <!-- =========================
         ENVELOPES
    ========================== -->

    <div id="envelopes" style="display:none;">

      <button
        class="envelope-zone env1"
        type="button"
        onclick="openEnvelope(1)"
        aria-label="Конверт 1">
      </button>

      <button
        class="envelope-zone env2"
        type="button"
        onclick="openEnvelope(2)"
        aria-label="Конверт 2">
      </button>

      <button
        class="envelope-zone env3"
        type="button"
        onclick="openEnvelope(3)"
        aria-label="Конверт 3">
      </button>

      <button
        class="envelope-zone env4"
        type="button"
        onclick="openEnvelope(4)"
        aria-label="Конверт 4">
      </button>

      <button
        class="envelope-zone env5"
        type="button"
        onclick="openEnvelope(5)"
        aria-label="Конверт 5">
      </button>

    </div>


    <!-- =========================
         ENVELOPE BACK
    ========================== -->

    <button
      id="envelopeBack"
      class="envelope-back"
      type="button"
      onclick="closeEnvelope()"
      style="display:none;"
      aria-label="Назад">
    </button>


    <!-- =========================
         TEST START
    ========================== -->

    <button
      id="testStart"
      class="test-start"
      type="button"
      onclick="startTest()"
      style="display:none;"
      aria-label="Начать тест">
    </button>


    <!-- =========================
         TEST ANSWERS
    ========================== -->

    <button
      id="answer1"
      class="test-option option1"
      type="button"
      onclick="selectAnswer(0)"
      style="display:none;"
      aria-label="Вариант ответа 1">
    </button>

    <button
      id="answer2"
      class="test-option option2"
      type="button"
      onclick="selectAnswer(1)"
      style="display:none;"
      aria-label="Вариант ответа 2">
    </button>

    <button
      id="answer3"
      class="test-option option3"
      type="button"
      onclick="selectAnswer(2)"
      style="display:none;"
      aria-label="Вариант ответа 3">
    </button>


    <!-- =========================
         TEST NEXT
    ========================== -->

    <button
      id="testNext"
      class="test-next"
      type="button"
      onclick="nextQuestion()"
      style="display:none;"
      aria-label="Следующий вопрос">
    </button>


    <!-- =========================
         RESULT
    ========================== -->

    <div id="resultOverlay" class="result-overlay">

      <div class="result-box">

        <div id="resultScore" class="result-score">
          0 / 50
        </div>

        <div id="resultText" class="result-text">
          Тест завершён
        </div>

        <button
          class="result-button"
          type="button"
          onclick="closeResult()">
          Закрыть
        </button>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   НАСТРОЙКИ
========================================================= */

const PASSWORD = "130425";

const LOGIN_KEY = "loveSiteLogin_v2";
const STATE_KEY = "loveSiteState_v2";

const LOGIN_DURATION = 24 * 60 * 60 * 1000;


/* =========================================================
   DOM
========================================================= */

const stage = document.getElementById("stage");
const pageImage = document.getElementById("pageImage");

const navigation = document.getElementById("navigation");

const loginLayer = document.getElementById("loginLayer");
const passwordInput = document.getElementById("passwordInput");
const loginError = document.getElementById("loginError");

const homeToggle = document.getElementById("homeToggle");

const envelopes = document.getElementById("envelopes");
const envelopeBack = document.getElementById("envelopeBack");

const testStart = document.getElementById("testStart");

const answer1 = document.getElementById("answer1");
const answer2 = document.getElementById("answer2");
const answer3 = document.getElementById("answer3");

const testNext = document.getElementById("testNext");

const resultOverlay = document.getElementById("resultOverlay");
const resultScore = document.getElementById("resultScore");
const resultText = document.getElementById("resultText");


/* =========================================================
   STATE
========================================================= */

let state = {
  page: 1,
  homeShort: false,
  envelope: 0,

  testStarted: false,
  q: 0,
  selected: null,
  answers: [],

  result: false,
  score: 0
};


/* =========================================================
   QUESTIONS
========================================================= */

const questions = [

  {
    q:"Если я говорю «я не хочу есть», насколько вероятно, что через час я скажу, что голодная?",
    a:["10%","50%","90%"],
    c:2
  },

  {
    q:"Если мне что-то очень нравится, я скорее…",
    a:["Буду постоянно об этом говорить","Сделаю вид, что мне всё равно","Никому не расскажу"],
    c:0
  },

  {
    q:"Если я устала, что во мне меняется первым?",
    a:["Настроение","Аппетит","Желание разговаривать"],
    c:2
  },

  {
    q:"Если я чего-то хочу, но боюсь попросить, я скорее…",
    a:["Намекну","Скажу прямо","Вообще ничего не скажу"],
    c:0
  },

  {
    q:"Если я обиделась, но не хочу говорить об этом, я скорее…",
    a:["Стану холоднее, но буду делать вид, что всё хорошо","Буду общаться как всегда","Сразу скажу"],
    c:0
  },

  {
    q:"Если я нервничаю перед чем-то важным, я скорее…",
    a:["Перестаю нормально спать","Начинаю всё перепроверять","Стараюсь вообще об этом не думать"],
    c:2
  },

  {
    q:"Когда я очень счастлива, я скорее…",
    a:["Начинаю много говорить","Становлюсь спокойнее","Не могу перестать улыбаться"],
    c:2
  },

  {
    q:"Если я не хочу что-то делать, меня легче всего убедить…",
    a:["Хорошей аргументацией","Лаской и заботой","Шуткой"],
    c:1
  },

  {
    q:"Что я обычно делаю перед тем, как начать важное дело?",
    a:["Откладываю его","Всё перепроверяю","Сразу начинаю"],
    c:0
  },

  {
    q:"Что я делаю, когда пытаюсь скрыть, что расстроилась?",
    a:["Становлюсь слишком спокойной","Начинаю улыбаться и шутить","Просто молчу"],
    c:2
  },

  {
    q:"Как я обычно реагирую на неловкую ситуацию?",
    a:["Шучу","Молчу","Хочу поскорее уйти"],
    c:0
  },

  {
    q:"Если я внезапно замолчала во время разговора, скорее всего…",
    a:["Я обиделась","Я что-то обдумываю","Я просто устала"],
    c:0
  },

  {
    q:"Если я говорю «всё нормально», что это означает?",
    a:["Всё нормально","Всё хорошо","Всё плохо"],
    c:2
  },

  {
    q:"Что мне сложнее всего сделать после ссоры?",
    a:["Написать первой","Признать, что я была неправа","Перестать думать о ситуации"],
    c:1
  },

  {
    q:"Если я чего-то сильно жду, я скорее…",
    a:["Постоянно проверяю время","Стараюсь отвлечься","Представляю, как всё произойдёт"],
    c:2
  },

  {
    q:"Как я реагирую, когда планы внезапно меняются?",
    a:["Спокойно перестраиваюсь","Меня это раздражает","Сначала паникую, потом привыкаю"],
    c:1
  },

  {
    q:"Если мне нужно выбрать подарок человеку, я скорее…",
    a:["Буду искать идеальный вариант","Выберу что-нибудь практичное","Придумаю что-нибудь личное"],
    c:0
  },

  {
    q:"Что меня может обидеть сильнее всего?",
    a:["Равнодушие","Резкие слова","Когда меня не слышат"],
    c:0
  },

  {
    q:"Что для меня хуже?",
    a:["Когда человек врёт","Когда человек скрывает правду","Когда человек делает вид, что ему всё равно"],
    c:0
  },

  {
    q:"Что мне труднее всего сказать человеку, который мне дорог?",
    a:["«Мне больно»","«Мне тебя не хватает»","«Мне нужна твоя помощь»"],
    c:2
  },

  {
    q:"Когда я действительно доверяю человеку, я…",
    a:["Рассказываю ему практически всё","Перестаю контролировать каждую мелочь","Не боюсь показывать слабость"],
    c:2
  },

  {
    q:"Что меня быстрее всего успокоит после плохого дня?",
    a:["Разговор","Объятия","Время наедине с собой"],
    c:1
  },

  {
    q:"Что заставляет меня чувствовать себя особенно любимой?",
    a:["Когда меня слушают","Когда обо мне заботятся без просьб","Когда мне говорят о своих чувствах"],
    c:1
  },

  {
    q:"Что я скорее замечу: большой подарок или маленькую деталь, которую человек запомнил обо мне?",
    a:["Большой подарок","Маленькую деталь","Зависит от ситуации"],
    c:1
  },

  {
    q:"Если я переживаю из-за чего-то, что мне нужно от близкого человека?",
    a:["Совет","Поддержка","Решение проблемы"],
    c:2
  },

  {
    q:"Как я понимаю, что человек действительно меня любит?",
    a:["По его словам","По его поступкам","По тому, как он ведёт себя со мной в мелочах"],
    c:2
  },

  {
    q:"Если я говорю «мне не холодно», что вероятнее всего произойдёт через некоторое время?",
    a:["Мне действительно не станет холодно","Я всё-таки замёрзну","Я начну жаловаться на холод"],
    c:1
  },

  {
    q:"Если я говорю «я не обиделась», что это может означать?",
    a:["Я не обиделась","Я обиделась, но не хочу говорить","Я уже почти перестала обижаться"],
    c:1
  },

  {
    q:"Если я начинаю рассказывать одну историю и внезапно ухожу в сторону, я…",
    a:["Забыла, о чём говорила","Просто вспомнила ещё одну историю","Проверяю твоё внимание"],
    c:1
  },

  {
    q:"Как я могу вести себя в одной и той же ситуации?",
    a:["Всегда одинаково","По-разному — всё зависит от моего настроения","Обычно противоположно тому, чего от меня ожидают"],
    c:1
  },

  {
    q:"Что лучше всего описывает моё настроение?",
    a:["Его довольно легко предсказать","Оно часто меняется","Оно почти никогда не меняется"],
    c:1
  },

  {
    q:"Я говорю: «Ничего». Перевод с моего языка:",
    a:["Ничего","Сейчас лучше не продолжать этот разговор","Конечно же, это значит совсем не «ничего»"],
    c:2
  },

  {
    q:"Если я говорю «мне всё равно», скорее всего…",
    a:["Мне действительно всё равно","Мне не всё равно, просто я не хочу это показывать","Я ещё не определилась"],
    c:1
  },

  {
    q:"Если я рассказываю тебе какую-то мелочь, которая произошла за день, это скорее значит, что…",
    a:["Мне просто нечем заняться","Мне хочется поделиться именно с тобой","Я хочу услышать твоё мнение"],
    c:1
  },

  {
    q:"Если мне хочется внимания, но я не хочу просить его напрямую, я скорее…",
    a:["Стану сама чаще писать","Начну намекать","Сделаю вид, что мне вообще не нужно внимание"],
    c:1
  },

  {
    q:"Если мы долго не виделись, что мне важнее всего в нашей встрече?",
    a:["Чтобы мы куда-нибудь сходили","Просто побыть рядом с тобой","Чтобы мы много разговаривали"],
    c:1
  },

  {
    q:"Если я рассказываю тебе о своей проблеме, чего я чаще всего хочу в первую очередь?",
    a:["Чтобы ты решил проблему","Чтобы ты просто выслушал меня","Чтобы ты меня отвлёк"],
    c:0
  },

  {
    q:"Если я говорю, что «ничего не хочу», но ты знаешь, что я устала, что мне скорее всего нужно?",

  },

  {

  },

  {

  },

  },

  {
    q:"Если я сказала «мне всё равно, выбирай сам», что я могу сделать через пять минут?",
    a:["Действительно соглашусь с твоим выбором","Вдруг предложу свой вариант","Спрошу, почему ты выбрал именно это"],
    c:1
  },

  {
    q:"Если мне хочется плакать, но я стараюсь держаться, я скорее…",
    a:["Стану молчаливой","Начну очень много шутить","Постараюсь сделать вид, что всё нормально"],
    c:2
  }

];


/* =========================================================
   LOCAL STORAGE
========================================================= */

function saveState(){

  try{
    localStorage.setItem(
      STATE_KEY,
      JSON.stringify(state)
    );
  }catch(e){
    console.log("Ошибка сохранения:",e);
  }

}


function loadState(){

  try{

    const saved = localStorage.getItem(STATE_KEY);

    if(saved){

      const parsed = JSON.parse(saved);

      state = {
        ...state,
        ...parsed
      };

    }

  }catch(e){

    console.log("Ошибка загрузки:",e);

  }

}


/* =========================================================
   LOGIN
========================================================= */

function isLoggedIn(){

  try{

    const saved = localStorage.getItem(LOGIN_KEY);

    if(!saved) return false;

    const time = Number(saved);

    if(!time) return false;

    return Date.now() - time < LOGIN_DURATION;

  }catch(e){

    return false;

  }

}


function setLoggedIn(){

  localStorage.setItem(
    LOGIN_KEY,
    String(Date.now())
  );

}


function login(){

  const value = passwordInput.value.trim();

  if(value === PASSWORD){

    setLoggedIn();

    loginLayer.style.display = "none";

    loginError.style.display = "none";

    navigation.style.display = "block";

    state.page = 2;

    saveState();

    render();

  }else{

    loginError.style.display = "block";

    passwordInput.value = "";

  }

}


passwordInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      login();
    }

  }
);


/* =========================================================
   PAGE IMAGE
========================================================= */

function imageForPage(page){

  const map = {

    1:"page-01.webp",

    2:"page-02.webp",
    3:"page-03.webp",

    4:"page-04.webp",

    5:"page-05.webp",
    6:"page-06.webp",

    7:"page-07.webp",
    8:"page-08.webp",

    9:"page-09.webp",
    10:"page-10.webp",

    11:"page-11.webp",
    12:"page-12.webp",

    13:"page-13.webp",
    14:"page-14.webp",

    15:"page-15.webp",

    16:"page-16.webp",

    17:"page-17.webp",

    18:"page-18.webp"

  };

  return map[page] || "page-01.webp";

}


/* =========================================================
   FIT STAGE
========================================================= */

function fitStage(){

  if(!pageImage.naturalWidth ||
     !pageImage.naturalHeight){

    return;

  }

  const imageRatio =
    pageImage.naturalWidth /
    pageImage.naturalHeight;

  const viewportWidth =
    window.innerWidth;

  const viewportHeight =
    window.innerHeight;

  let width =
    viewportWidth;

  let height =
    width / imageRatio;

  if(height > viewportHeight){

    height =
      viewportHeight;

    width =
      height * imageRatio;

  }

  stage.style.width =
    Math.floor(width) + "px";

  stage.style.height =
    Math.floor(height) + "px";

}


pageImage.addEventListener(
  "load",
  fitStage
);


window.addEventListener(
  "resize",
  fitStage
);


window.addEventListener(
  "orientationchange",
  function(){

    setTimeout(
      fitStage,
      150
    );

  }
);


/* =========================================================
   RENDER
========================================================= */

function render(){

  pageImage.src =
    imageForPage(state.page);

  navigation.style.display =
    state.page >= 2
      ? "block"
      : "none";

  homeToggle.style.display =
    state.page === 2 || state.page === 3
      ? "block"
      : "none";

  envelopes.style.display =
    state.page === 4
      ? "block"
      : "none";

  envelopeBack.style.display =
    state.page >= 5 &&
    state.page <= 14
      ? "block"
      : "none";

  testStart.style.display =
    state.page === 16 &&
    !state.testStarted
      ? "block"
      : "none";

  const inTest =
    state.page === 17 &&
    state.testStarted &&
    !state.result;

  answer1.style.display =
    inTest ? "block" : "none";

  answer2.style.display =
    inTest ? "block" : "none";

  answer3.style.display =
    inTest ? "block" : "none";

  testNext.style.display =
    inTest ? "block" : "none";

  resultOverlay.style.display =
    state.result
      ? "flex"
      : "none";

  fitStage();

}


/* =========================================================
   NAVIGATION
========================================================= */

function goHome(){

  state.page =
    state.homeShort
      ? 3
      : 2;

  state.envelope = 0;

  saveState();

  render();

}


function goAbout(){

  state.page = 4;

  state.envelope = 0;

  saveState();

  render();

}


function goUs(){

  state.page = 15;

  saveState();

  render();

}


function goTest(){

  /*
    Если тест уже был начат,
    открываем его с сохранённого вопроса.
  */

  if(state.testStarted){

    state.page = 17;

  }else{

    state.page = 16;

  }

  saveState();

  render();

}


function goWhen(){

  state.page = 18;

  saveState();

  render();

}


/* =========================================================
   HOME
========================================================= */

function toggleHome(){

  state.homeShort =
    !state.homeShort;

  state.page =
    state.homeShort
      ? 3
      : 2;

  saveState();

  render();

}


/* =========================================================
   ENVELOPES
========================================================= */

function openEnvelope(number){

  state.envelope =
    number;

  /*
    1 -> page 5
    2 -> page 7
    3 -> page 9
    4 -> page 11
    5 -> page 13
  */

  state.page =
    4 + ((number - 1) * 2) + 1;

  saveState();

  render();

}


function closeEnvelope(){

  if(state.envelope >= 1 &&
     state.envelope <= 5){

    /*
      Возвращаемся к соответствующему
      конверту/странице.
    */

    state.page = 4;

    state.envelope = 0;

  }else{

    state.page = 4;

  }

  saveState();

  render();

}


/* =========================================================
   TEST
========================================================= */

function createAnswers(){

  return Array(
    questions.length
  ).fill(null);

}


function startTest(){

  /*
    Если тест уже существует,
    НЕ создаём его заново.
    Возвращаемся туда, где остановились.
  */

  if(
    !Array.isArray(state.answers) ||
    state.answers.length !== questions.length
  ){

    state.answers =
      createAnswers();

    state.q = 0;

    state.selected = null;

  }

  state.testStarted = true;

  state.result = false;

  state.page = 17;

  /*
    Если уже есть сохранённый ответ
    на текущий вопрос — показываем его.
  */

  state.selected =
    state.answers[state.q] !== null
      ? state.answers[state.q]
      : null;

  saveState();

  render();

}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(index){

  /*
    Самое важное исправление.

    Не проверяем state.page === 17
    слишком жёстко, потому что на мобильном
    браузер может вызвать событие в момент
    перерисовки.

    Проверяем только, что тест запущен.
  */

  if(!state.testStarted){
    return;
  }

  if(state.result){
    return;
  }

  if(
    index < 0 ||
    index > 2
  ){

    return;

  }

  state.selected =
    index;

  state.answers[state.q] =
    index;

  saveState();

  /*
    Не перерисовываем картинку через
    render() здесь.

    Это важно:
    кнопка остаётся на месте,
    и нажатие на телефоне не теряется.
  */

  updateAnswerState();

}


/* =========================================================
   ANSWER VISUAL STATE
========================================================= */

function updateAnswerState(){

  /*
    Сам дизайн картинки не меняем.

    Только делаем выбранную область
    чуть заметной во время нажатия.
  */

  answer1.style.background =
    state.selected === 0
      ? "rgba(255,255,255,0.08)"
      : "transparent";

  answer2.style.background =
    state.selected === 1
      ? "rgba(255,255,255,0.08)"
      : "transparent";

  answer3.style.background =
    state.selected === 2
      ? "rgba(255,255,255,0.08)"
      : "transparent";

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

  if(!state.testStarted){
    return;
  }

  if(state.selected === null){

    return;

  }

  /*
    Сохраняем ответ ещё раз
    непосредственно перед переходом.
  */

  state.answers[state.q] =
    state.selected;

  /*
    Последний вопрос
  */

  if(
    state.q >=
    questions.length - 1
  ){

    finishTest();

    return;

  }

  /*
    Следующий вопрос
  */

  state.q++;

  state.selected =
    state.answers[state.q] !== null
      ? state.answers[state.q]
      : null;

  saveState();

  render();

  /*
    После render снова применяем
    состояние ответа.
  */

  setTimeout(
    updateAnswerState,
    50
  );

}


/* =========================================================
   FINISH TEST
========================================================= */

function finishTest(){

  let score = 0;

  for(
    let i = 0;
    i < questions.length;
    i++
  ){

    if(
      state.answers[i] ===
      questions[i].c
    ){

      score++;

    }

  }

  state.score =
    score;

  state.result =
    true;

  saveState();

  resultScore.textContent =
    score + " / " + questions.length;

  if(score === questions.length){

    resultText.textContent =
      "Ты знаешь меня идеально ❤️";

  }else if(score >= 40){

    resultText.textContent =
      "Ты очень хорошо меня знаешь ❤️";

  }else if(score >= 25){

    resultText.textContent =
      "Ты знаешь меня довольно хорошо ❤️";

  }else{

    resultText.textContent =
      "Нам есть что ещё узнать друг о друге ❤️";

  }

  render();

}


/* =========================================================
   CLOSE RESULT
========================================================= */

function closeResult(){

  state.result =
    false;

  /*
    После результата оставляем
    тест на последнем вопросе.

    При повторном открытии можно
    начать тест заново вручную.
  */

  state.page = 16;

  saveState();

  render();

}


/* =========================================================
   TOUCH FIX
========================================================= */

/*
  На iPhone Safari иногда click по прозрачной
  кнопке поверх картинки работает нестабильно.

  Поэтому дополнительно обрабатываем touchend.

  ВАЖНО:
  не вызываем preventDefault(),
  чтобы обычный click тоже мог пройти.
*/

function addTouchHandler(element, callback){

  element.addEventListener(
    "touchend",
    function(e){

      if(e.changedTouches &&
         e.changedTouches.length){

        callback(e);

      }

    },
    {
      passive:true
    }
  );

}


addTouchHandler(
  answer1,
  function(){

    selectAnswer(0);

  }
);


addTouchHandler(
  answer2,
  function(){

    selectAnswer(1);

  }
);


addTouchHandler(
  answer3,
  function(){

    selectAnswer(2);

  }
);


addTouchHandler(
  testNext,
  function(){

    nextQuestion();

  }
);


addTouchHandler(
  testStart,
  function(){

    startTest();

  }
);


/* =========================================================
   RESTORE
========================================================= */

function init(){

  loadState();

  /*
    Пароль действует 24 часа.

    Если срок закончился —
    показываем страницу пароля.

    При этом STATE_KEY НЕ удаляется,
    поэтому тест сохраняется.
  */

  if(isLoggedIn()){

    loginLayer.style.display =
      "none";

    navigation.style.display =
      "block";

    /*
      Если пользователь обновил страницу
      во время теста — возвращаем его
      прямо к текущему вопросу.
    */

    if(state.testStarted &&
       !state.result){

      state.page = 17;

    }

  }else{

    loginLayer.style.display =
      "block";

    navigation.style.display =
      "none";

    state.page = 1;

  }

  render();

}


init();

</script>
