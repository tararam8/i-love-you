*/
const LOGIN_DURATION = 24 * 60 * 60 * 1000;

const STATE_KEY = "loveSiteState_v2";

   СОХРАНЕНИЕ СОСТОЯНИЯ
========================================================= */

function saveState(){

  try{

    localStorage.setItem(
      STATE_KEY,
      JSON.stringify(state)
    );

  }catch(error){

    console.warn(
      "Не удалось сохранить состояние:",
      error
    );

  }
}


/* =========================================================
   ЗАГРУЗКА СОСТОЯНИЯ
========================================================= */

function loadState(){

  try{

    const saved =
      localStorage.getItem(STATE_KEY);

    if(!saved){

      state = {
        ...defaultState
      };

      return;
    }

    const parsed =
      JSON.parse(saved);

    state = {
      ...defaultState,
      ...parsed
    };

    /*
      Защита от повреждённого массива ответов.
    */
    if(!Array.isArray(state.answers)){

      state.answers = [];

    }

  }catch(error){

    console.warn(
      "Не удалось загрузить состояние:",
      error
    );

    state = {
      ...defaultState
    };

  }
}

========================================================= */

function isLoginValid(){

  try{

    const saved =
      localStorage.getItem(LOGIN_KEY);

    if(!saved){

      return false;
    }

    const loginData =
      JSON.parse(saved);

    if(
      !loginData ||
      !loginData.expires
    ){

      localStorage.removeItem(LOGIN_KEY);

      return false;
    }

    if(Date.now() >= loginData.expires){

      /*
        Удаляем ТОЛЬКО информацию о входе.

        STATE_KEY не трогаем,
        поэтому тест и весь его прогресс
        остаются сохранёнными.
      */

      localStorage.removeItem(LOGIN_KEY);

      return false;
    }

    return true;

  }catch(error){

    localStorage.removeItem(LOGIN_KEY);

    return false;
  }
}

/* =========================================================
   ПРОПОРЦИИ
========================================================= */

function fixStageRatio(){

  const stage =
    document.getElementById("stage");

  if(!stage) return;

  const page =
    stage.querySelector(".page");

  if(!page) return;

  function setRatio(){

    if(
      page.naturalWidth &&
      page.naturalHeight
    ){

      stage.style.aspectRatio =
        page.naturalWidth +
        " / " +
        page.naturalHeight;
    }
  }

  if(page.complete){

    setRatio();

  }else{

    page.addEventListener(
      "load",
      setRatio,
      {once:true}
    );

  }
}

        aria-label="О тебе">
      </button>

      <button
        onclick="goUs()"
        aria-label="Мы">
      </button>

      <button
        onclick="goTestIntro()"
        aria-label="Тест">
      </button>

      <button
        onclick="goWhen()"
        aria-label="Когда">
      </button>

    </div>
  `;
}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  const input =
    document.getElementById("loginInput");

  const err =
    document.getElementById("err");

  if(!input) return;

  const value =
    input.value.trim();

  if(value === CODE){

    /*
      Сначала сохраняем вход.
    */
    saveLogin();

    /*
      ВАЖНО:
      Если сохранённый state уже содержит
      прогресс теста, мы его НЕ сбрасываем.

      После повторного входа просто возвращаем
      пользователя на главную.
    */

    state.page = "home";

    saveState();

    render();

  }else{

    input.value = "";

    if(err){

      err.classList.add("show");

      setTimeout(function(){

        err.classList.remove("show");

      },1800);

    }

  }
}


/* =========================================================
   HOME
========================================================= */

function goHome(){

  state.page =
    state.homeShort
      ? "homeShort"
      : "home";

  state.envelope = 0;

  saveState();

  render();
}


/* =========================================================
   ABOUT
========================================================= */

function goAbout(){

  state.page = "about";

  state.envelope = 0;

  saveState();

  render();
}


/* =========================================================
   US
========================================================= */

function goUs(){

  state.page = "us";

  state.envelope = 0;

  saveState();

  render();
}


/* =========================================================
   WHEN
========================================================= */

function goWhen(){

  state.page = "when";

  state.envelope = 0;

  saveState();

  render();
}


/* =========================================================
   HOME SHORT
========================================================= */

function toggleHome(){

  state.homeShort =
    !state.homeShort;

  state.page =
    state.homeShort
      ? "homeShort"
      : "home";

  saveState();

  render();
}


/* =========================================================
   ENVELOPES
========================================================= */

function chooseEnvelope(number){

  /*
    Первый клик:
    закрытый конверт увеличивается.

    Второй клик:
    открывается письмо.
  */

  if(state.envelope === number){

    state.page =
      "letter" + number;

    saveState();

    render();

    return;
  }

  state.envelope = number;

  state.page = "envelopeZoom";

  saveState();

  render();
}


function backToEnvelopes(){

  state.envelope = 0;

  state.page = "about";

  saveState();

  render();
}


/* =========================================================
   TEST INTRO
========================================================= */

function goTestIntro(){

  state.page = "testIntro";

  saveState();

  render();
}


/* =========================================================
   ЕСТЬ ЛИ СОХРАНЁННЫЙ ТЕСТ
========================================================= */

function hasTestProgress(){

  if(!Array.isArray(state.answers)){

    return false;
  }

  /*
    Тест считается начатым, если:
    - пользователь уже находится внутри теста;
    - есть выбранный ответ;
    - есть хотя бы один сохранённый ответ;
    - текущий вопрос изменился.
  */

  return (
    state.page === "test" ||
    state.page === "result" ||
    state.q > 0 ||
    state.selected !== null ||
    state.answers.some(
      answer => answer !== null
    )
  );
}


/* =========================================================
   START / RESUME TEST
========================================================= */

function startTest(){

  /*
    Если тест уже был начат,
    НЕ сбрасываем его.

    Кнопка «Начать тест» в этом случае
    продолжает сохранённый тест.
  */

  if(hasTestProgress()){

    /*
      Восстанавливаем выбранный ответ
      для текущего вопроса.
    */

    if(
      Array.isArray(state.answers) &&
      state.answers[state.q] !== null &&
      state.answers[state.q] !== undefined
    ){

      state.selected =
        state.answers[state.q];

    }

    state.page = "test";

    saveState();

    render();

    return;
  }

  /*
    Только если тест действительно
    ещё ни разу не начинался —
    создаём новый.
  */

  state.q = 0;

  state.selected = null;

  state.score = 0;

  state.answers =
    new Array(Q.length).fill(null);

  state.page = "test";

  saveState();

  render();
}


/* =========================================================
   ВЫБОР ОТВЕТА
========================================================= */

function selectAnswer(index){

  state.selected = index;

  /*
    Сразу записываем ответ.
    Даже если пользователь обновит страницу
    сразу после нажатия, ответ уже сохранён.
  */

  if(!Array.isArray(state.answers)){

    state.answers =
      new Array(Q.length).fill(null);
  }

  state.answers[state.q] = index;

  saveState();

  render();
}


/* =========================================================
   СЛЕДУЮЩИЙ ВОПРОС
========================================================= */

function nextQuestion(){

  /*
    Нельзя перейти дальше,
    пока ответ не выбран.
  */

  if(state.selected === null){

    return;
  }

  state.answers[state.q] =
    state.selected;

  /*
    Последний вопрос.
  */

  if(state.q === Q.length - 1){

    state.score = 0;

    for(
      let i = 0;
      i < Q.length;
      i++
    ){

      if(
        state.answers[i] === Q[i][2]
      ){

        state.score++;
      }
    }

    state.page = "result";

    saveState();

    render();

    return;
  }

  /*
    Переходим к следующему вопросу.
  */

  state.q++;

  /*
    Восстанавливаем ранее выбранный
    ответ, если пользователь вернулся
    к этому вопросу.
  */

  state.selected =
    state.answers[state.q] === null ||
    state.answers[state.q] === undefined
      ? null
      : state.answers[state.q];

  saveState();

  render();
}


/* =========================================================
   ПРЕДЫДУЩИЙ ВОПРОС
========================================================= */

function prevQuestion(){

  if(state.q <= 0){

    return;
  }

  state.answers[state.q] =
    state.selected;

  state.q--;

  state.selected =
    state.answers[state.q] === null ||
    state.answers[state.q] === undefined
      ? null
      : state.answers[state.q];

  saveState();

  render();
}


/* =========================================================
   НАЧАТЬ ТЕСТ ЗАНОВО
========================================================= */

function restartTest(){

  state.q = 0;

  state.selected = null;

  state.score = 0;

  state.answers =
    new Array(Q.length).fill(null);

  state.page = "testIntro";

  saveState();

  render();
}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const app =
    document.getElementById("app");

  let s = "";


  /* ---------------------------------
     LOGIN
  --------------------------------- */

  if(state.page === "login"){

    s = screen(

      img(1) +

      `
        <input
          id="loginInput"
          class="login-input"
          type="text"
          inputmode="numeric"
          maxlength="6"
          autocomplete="off"
          aria-label="Код"
        >

        <button
          class="login-heart"
          onclick="login()"
          aria-label="Войти">
        </button>

        <div
          id="err"
          class="login-error">
          Неправильная дата
        </div>
      `

    );

  }


  /* ---------------------------------
     HOME
  --------------------------------- */

  else if(state.page === "home"){

    s = screen(

      img(2) +

      nav() +

      `
        <button
          class="home-short-hot"
          onclick="toggleHome()"
          aria-label="Сократить">
        </button>
      `

    );

  }


  /* ---------------------------------
     HOME SHORT
  --------------------------------- */

  else if(state.page === "homeShort"){

    s = screen(

      img(3) +

      nav() +

      `
        <button
          class="home-short-hot"
          onclick="toggleHome()"
          aria-label="Обратно">
        </button>
      `

    );

  }


  /* ---------------------------------
     ABOUT
  --------------------------------- */

  else if(state.page === "about"){

    s = screen(

      img(4) +

      nav() +

      `
        <button
          class="envelope-zone env1"
          onclick="chooseEnvelope(1)">
        </button>

        <button
          class="envelope-zone env2"
          onclick="chooseEnvelope(2)">
        </button>

        <button
          class="envelope-zone env3"
          onclick="chooseEnvelope(3)">
        </button>

        <button
          class="envelope-zone env4"
          onclick="chooseEnvelope(4)">
        </button>

        <button
          class="envelope-zone env5"
          onclick="chooseEnvelope(5)">
        </button>
      `

    );

  }


  /* ---------------------------------
     ENVELOPE ZOOM
  --------------------------------- */

  else if(state.page === "envelopeZoom"){

    const number =
      state.envelope;

    const closedPage =
      5 + ((number - 1) * 2);

    s = screen(

      img(closedPage) +

      nav() +

      `
        <button
          class="zoom-envelope"
          onclick="chooseEnvelope(${number})"
          aria-label="Открыть конверт">
        </button>

        <button
          class="back-zone"
          onclick="backToEnvelopes()"
          aria-label="Назад">
        </button>
      `

    );

  }


  /* ---------------------------------
     LETTERS
  --------------------------------- */

  else if(
    state.page === "letter1" ||
    state.page === "letter2" ||
    state.page === "letter3" ||
    state.page === "letter4" ||
    state.page === "letter5"
  ){

    const number =
      Number(
        state.page.replace(
          "letter",
          ""
        )
      );

    const letterPage =
      6 + ((number - 1) * 2);

    s = screen(

      img(letterPage) +

      nav() +

      `
        <button
          class="back-zone"
          onclick="backToEnvelopes()"
          aria-label="Назад">
        </button>
      `

    );

  }


  /* ---------------------------------
     US
  --------------------------------- */

  else if(state.page === "us"){

    s = screen(

      img(15) +

      nav()

    );

  }


  /* ---------------------------------
     TEST INTRO
  --------------------------------- */

  else if(state.page === "testIntro"){

    s = screen(

      img(16) +

      nav() +

      `
        <button
          class="test-start"
          onclick="startTest()"
          aria-label="Начать тест">
        </button>
      `

    );

  }


  /* ---------------------------------
     TEST
  --------------------------------- */

  else if(state.page === "test"){

    /*
      Защита от ошибки,
      если состояние каким-то образом
      повреждено.
    */

    if(
      state.q < 0 ||
      state.q >= Q.length
    ){

      state.q = 0;
    }

    const question =
      Q[state.q];

    const selected =
      state.selected;

    s = screen(

      img(17) +

      nav() +

      `
        <div
          style="
            position:absolute;
            z-index:35;
            left:41%;
            top:56%;
            width:30%;
            height:7%;
            pointer-events:none;
          ">
        </div>

        <button
          class="test-option option1"
          onclick="selectAnswer(0)"
          aria-label="${question[1][0]}">
        </button>

        <button
          class="test-option option2"
          onclick="selectAnswer(1)"
          aria-label="${question[1][1]}">
        </button>

        <button
          class="test-option option3"
          onclick="selectAnswer(2)"
          aria-label="${question[1][2]}">
        </button>

        <button
          class="test-next"
          onclick="nextQuestion()"
          aria-label="Следующий вопрос">
        </button>
      `

    );

  }


  /* ---------------------------------
     RESULT
  --------------------------------- */

  else if(state.page === "result"){

    s = screen(

      img(17) +

      nav() +

      `
        <div class="test-result">

          <div>

            <div>
              Ты ответил правильно
            </div>

            <div
              style="
                font-size:clamp(40px,8vw,100px);
                margin-top:10px;
                color:#e91e91;
              ">
              ${state.score}/50
            </div>

            <div
              style="
                font-size:clamp(18px,3vw,35px);
                margin-top:15px;
              ">
              вопросов
            </div>

            <button
              onclick="restartTest()">
              Пройти ещё раз
            </button>

          </div>

        </div>
      `

    );

  }


  /* ---------------------------------
     WHEN
  --------------------------------- */

  else if(state.page === "when"){

    s = screen(

      img(18) +

      nav()

    );

  }


  app.innerHTML = s;

  fixStageRatio();


  /* ---------------------------------
     ENTER НА LOGIN
  --------------------------------- */

  if(state.page === "login"){

    const input =
      document.getElementById(
        "loginInput"
      );

    if(input){

      input.addEventListener(
        "keydown",
        function(e){

          if(e.key === "Enter"){

            e.preventDefault();

            login();

          }

        }
      );

    }

  }
}


/* =========================================================
   СОХРАНЕНИЕ ПРИ СВЕРТЫВАНИИ / ПЕРЕХОДЕ
========================================================= */

window.addEventListener(
  "beforeunload",
  function(){

    saveState();

  }
);


document.addEventListener(
  "visibilitychange",
  function(){

    if(document.visibilityState === "hidden"){

      saveState();

    }

  }
);


/* =========================================================
   ЗАПУСК
========================================================= */

loadState();

const loggedIn =
  isLoginValid();


/*
  Если пароль ещё действует —
  сразу открываем сохранённую страницу.

  Если пароль истёк —
  показываем экран ввода пароля,
  НО сохранённый тест не удаляем.
*/

if(loggedIn){

  /*
    Если состояние почему-то оказалось
    некорректным, возвращаемся домой.

    При нормальном состоянии сохраняется
    последняя страница.
  */

  if(!state.page){

    state.page = "home";

  }

}else{

  state.page = "login";

}

render();

</script>
